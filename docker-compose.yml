services:
  # 1. Redis
  redis:
    image: redis:alpine
    container_name: recruitment-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # 2. Local Postgres with pgvector extension (required for vector(1536) columns in schema)
  postgres:
    image: pgvector/pgvector:pg17
    container_name: recruitment-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruitment
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 3. Backend
  backend:
    build:
      context: ./backend
      target: development
    container_name: recruitment-backend
    ports:
      - "3000:3000"
      - "5555:5555" # Prisma Studio
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=development
      # Override DB URLs if using local postgres
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/recruitment
      - DIRECT_URL=postgresql://postgres:postgres@postgres:5432/recruitment
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./database:/database:ro
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # # 4. Frontend
